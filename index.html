const EVENT_ID='ANIMO-PICKLEBALL-CUP-2026';
const PUBLIC_SCHEMA='acms-public-state-v1';
const SUPABASE_URL='https://jlulpedqnhictamnfbdm.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_y6eD8u39IBuv-WdWa2BhnA_l9q_2en0';
const CACHE_KEY='animo-match-control-player-feed-v2';
const FOLLOW_KEY='animo-match-control-player-followed-v1';
const DEMO=window.ANIMO_DEMO;
const LOGO=window.ANIMO_LOGO;
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const ui={view:'my',more:false,modal:null,division:'All',court:'All',status:'All',query:'',scheduleMode:'timeline',standingsDivision:'All',playoffDivision:'All',playerQuery:'',followed:loadFollowed()};
const feed={status:'connecting',version:0,updatedAt:null,error:null,requesting:false};
function loadFollowed(){try{const x=JSON.parse(localStorage.getItem(FOLLOW_KEY)||'[]');return Array.isArray(x)?x.filter(v=>typeof v==='string').slice(0,8):[]}catch(_){return[]}}
function saveFollowed(){try{localStorage.setItem(FOLLOW_KEY,JSON.stringify(ui.followed))}catch(_){}}
function validSnapshot(p){return !!p&&p.schema===PUBLIC_SCHEMA&&p.eventId===EVENT_ID&&Number(p.version)>=1&&Array.isArray(p.roster)&&Array.isArray(p.matches)&&Array.isArray(p.playoffs)}
let liveData=null;
function loadCache(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(validSnapshot(x?.payload)){liveData=x.payload;feed.version=Number(x.payload.version)||0;feed.updatedAt=x.updatedAt||x.payload.updatedAt||null;feed.status='cached'}}catch(_){}}
async function refreshFeed(force=false){if(feed.requesting)return;if(document.hidden&&!force)return;feed.requesting=true;const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),9000);try{const path='/rest/v1/ppx_public_feed?select=event_id,version,updated_at,payload&event_id=eq.'+encodeURIComponent(EVENT_ID)+'&limit=1';const r=await fetch(SUPABASE_URL+path,{headers:{apikey:PUBLISHABLE_KEY,Accept:'application/json'},cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);const rows=await r.json();if(!rows.length){feed.status=liveData?'cached':'waiting';feed.error=null;render();return}const row=rows[0],p=row.payload;if(row.event_id!==EVENT_ID||!validSnapshot(p)||Number(row.version)!==Number(p.version))throw new Error('Feed validation failed');if(Number(p.version)>=feed.version){liveData=p;feed.version=Number(p.version);feed.updatedAt=row.updated_at||p.updatedAt||null;try{localStorage.setItem(CACHE_KEY,JSON.stringify({updatedAt:feed.updatedAt,payload:p}))}catch(_){}}feed.status='live';feed.error=null;render()}catch(e){feed.status=liveData?'offline':'unavailable';feed.error=String(e?.message||e);render()}finally{clearTimeout(timer);feed.requesting=false}}
function data(){return liveData||DEMO}function rosterMap(d=data()){return new Map((d.roster||[]).map(t=>[t.code,t]))}function allMatches(d=data()){return [...(d.matches||[]),...(d.playoffs||[])]}function courts(d=data()){return [...new Set(allMatches(d).map(m=>Number(m.court)).filter(Number.isFinite))].sort((a,b)=>a-b)}function divisions(d=data()){return [...new Set((d.roster||[]).map(t=>t.division).filter(Boolean))]}function brackets(d,div){return [...new Set((d.roster||[]).filter(t=>t.division===div).map(t=>t.bracket).filter(Boolean))].sort()}
function niceTime(s){const m=String(s||'').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);if(!m)return s||'TBD';let h=Number(m[1]);const ap=(m[3]||(h>=12?'PM':'AM')).toUpperCase();return `${(h%12)||12}:${m[2]} ${ap}`}
function timeNum(s){const m=String(s||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);if(!m)return 9999;let h=Number(m[1]),n=Number(m[2]);if(m[3])h=(h%12)+(m[3].toUpperCase()==='PM'?12:0);return h*60+n}
function done(m){return ['Completed','Forfeit','Disqualified'].includes(String(m?.status||''))}function live(m){return /^(Live|Timeout|Hold)$/i.test(String(m?.status||''))}function winner(m){if(m?.winner)return m.winner;if(done(m)&&m.scoreA!=null&&m.scoreB!=null&&Number(m.scoreA)!==Number(m.scoreB))return Number(m.scoreA)>Number(m.scoreB)?m.teamA:m.teamB;return null}
function teamNames(t){return t?.players?.filter(Boolean).join(' / ')||t?.code||'To be determined'}function teamOf(code,d=data()){return rosterMap(d).get(code)}
function statusLabel(m){if(live(m))return'Live';if(done(m))return m.status==='Completed'?'Final':m.status;return m.status||'Scheduled'}
function matchCard(m,d=data()){const map=rosterMap(d),a=map.get(m.teamA),b=map.get(m.teamB),has=live(m)||done(m),w=winner(m);const row=(t,c,s)=>`<div class="team-row"><div><strong>${esc(teamNames(t))}</strong><small>${esc(c||'TBD')}</small></div>${has?`<span class="score">${esc(s??'—')}</span>`:''}</div>`;return `<button class="match-card ${live(m)?'live':''}" data-match="${esc(m.id)}"><div class="match-top"><span class="match-id">${esc(m.id)}</span><span class="match-stage">${esc(m.stage||'Preliminary')}${m.bracket?` · Bracket ${esc(m.bracket)}`:''}</span><span class="status ${live(m)?'live':done(m)?'final':''}">${esc(statusLabel(m))}</span></div>${row(a,m.teamA,m.scoreA)}<div class="versus">VS</div>${row(b,m.teamB,m.scoreB)}<div class="match-foot"><span>Court ${esc(m.court||'TBD')}</span><span>${esc(niceTime(m.time))}</span><span>Details →</span></div></button>`}
function personOptions(d,q){q=String(q||'').trim().toLowerCase();if(q.length<2)return[];const out=[];(d.roster||[]).forEach(t=>(t.players||[]).forEach((name,i)=>{const hay=[name,t.code,t.division,t.bracket].join(' ').toLowerCase();if(hay.includes(q))out.push({key:`${t.code}:${i}`,name,team:t,index:i})}));return out.slice(0,18)}
function profiles(d=data()){const map=rosterMap(d);return ui.followed.map(k=>{const p=k.lastIndexOf(':'),t=map.get(k.slice(0,p)),i=Number(k.slice(p+1));return t&&t.players?.[i]?{key:k,name:t.players[i],team:t,index:i}:null}).filter(Boolean)}
function myMatchesData(d=data()){const ps=profiles(d),codes=new Set(ps.map(p=>p.team.code)),list=allMatches(d).filter(m=>!m.removedFromSchedule&&(codes.has(m.teamA)||codes.has(m.teamB))).sort((a,b)=>timeNum(a.time)-timeNum(b.time)||Number(a.court)-Number(b.court));return{profiles:ps,list,live:list.filter(live),upcoming:list.filter(m=>!done(m)&&!live(m)),finished:list.filter(done)}}
function nextForTeam(code,d=data()){return allMatches(d).filter(m=>!m.removedFromSchedule&&!done(m)&&!live(m)&&(m.teamA===code||m.teamB===code)).sort((a,b)=>timeNum(a.time)-timeNum(b.time)||Number(a.court)-Number(b.court))[0]||null}
function feedLabel(){if(feed.status==='live')return'Live updates';if(feed.status==='cached'||feed.status==='offline')return'Saved update';if(feed.status==='waiting')return'Awaiting publish';if(feed.status==='unavailable')return'Schedule preview';return'Connecting'}
function progress(d=data()){const all=allMatches(d),fin=all.filter(done).length,li=all.filter(live).length;return{total:all.length,fin,li,left:all.length-fin-li}}

function playerSearchBlock(){const q=ui.playerQuery,rs=personOptions(data(),q);return `<div class="search-box"><div class="player-search"><input id="playerSearch" type="search" autocomplete="off" placeholder="Find your registered name or team code" value="${esc(q)}"><button class="primary-btn" type="button">Find me</button></div>${q.length>=2?`<div class="search-results">${rs.length?rs.map(x=>`<button class="search-result" data-follow="${esc(x.key)}"><b>${esc(x.name)}</b><span>${esc(x.team.division)} · Bracket ${esc(x.team.bracket)} · ${esc(x.team.code)} · Partner: ${esc(x.team.players.filter((_,i)=>i!==x.index).join(' / ')||'TBD')}</span></button>`).join(''):`<div class="empty">No matching roster entry.</div>`}</div>`:''}</div>`}

function courtStrip(d){const cs=courts(d),all=allMatches(d);return `<div class="section-head"><div><div class="eyebrow">LIVE COURTS</div><h3>Across the venue</h3></div><button class="link-btn" data-nav="live">Open court view →</button></div><div class="court-strip">${cs.map(c=>{const on=all.find(m=>Number(m.court)===c&&live(m)),next=all.filter(m=>Number(m.court)===c&&!done(m)&&!live(m)).sort((a,b)=>timeNum(a.time)-timeNum(b.time))[0],m=on||next,mp=rosterMap(d);return `<button class="court-card ${on?'live':''}" ${m?`data-match="${esc(m.id)}"`:''}><div class="court-top"><b>Court ${c}</b><span class="state-chip ${on?'live':''}">${on?'Live':m?'Next':'Open'}</span></div>${m?`<strong>${esc(teamNames(mp.get(m.teamA)))}</strong><span>vs ${esc(teamNames(mp.get(m.teamB)))}</span><span>${on?'In progress':esc(niceTime(m.time))} · ${esc(m.id)}</span>`:`<span>Awaiting assignment</span>`}</button>`}).join('')}</div>`}
function myPage(d){const p=myMatchesData(d),map=rosterMap(d),next=p.live[0]||p.upcoming[0];return `<header class="page-head"><div><div class="eyebrow">PERSONAL MATCH DAY</div><h2>My Matches</h2><p>Save one or more roster entries on this device to keep your schedule and results together.</p></div></header><div class="my-shell"><div class="my-main">${next?`<section class="personal-hero"><div class="eyebrow">${p.live.length?'LIVE NOW':'NEXT MATCH'}</div><div class="next-court">Court ${esc(next.court||'TBD')}</div><h3>${esc(niceTime(next.time))} · ${esc(next.stage||'Match')}</h3><p class="muted">${esc(teamNames(map.get(next.teamA)))} vs ${esc(teamNames(map.get(next.teamB)))}</p><button class="primary-btn" data-match="${esc(next.id)}">View match details</button></section>`:`<div class="empty"><b>No upcoming match</b>${p.finished.length?'Your completed matches are listed below.':'Add your player entry to personalize this page.'}</div>`}<div class="section-head"><div><h3>${p.list.length?'Your tournament matches':'Find your player entry'}</h3></div></div>${p.list.length?`<div class="personal-grid">${p.list.map(m=>matchCard(m,d)).join('')}</div>`:playerSearchBlock()}</div><aside class="my-side"><section class="surface" style="padding:16px"><div class="section-head" style="margin:0 0 12px"><div><div class="eyebrow">THIS DEVICE</div><h3 style="font-size:16px">Saved players</h3></div></div><div class="saved-list">${p.profiles.length?p.profiles.map(x=>`<div class="saved-entry"><span class="avatar">${esc(x.name.slice(0,1))}</span><div><b>${esc(x.name)}</b><span>${esc(x.team.code)} · ${esc(x.team.division)}</span></div><button data-remove-follow="${esc(x.key)}" aria-label="Remove ${esc(x.name)}">×</button></div>`).join(''):'<span class="muted" style="font-size:10px">No player saved yet.</span>'}</div><div style="margin-top:12px">${playerSearchBlock()}</div></section></aside></div>`}
function filteredMatches(d){return allMatches(d).filter(m=>!m.removedFromSchedule).filter(m=>ui.division==='All'||m.division===ui.division).filter(m=>ui.court==='All'||String(m.court)===String(ui.court)).filter(m=>ui.status==='All'||(ui.status==='Live'?live(m):ui.status==='Final'?done(m):ui.status==='Upcoming'?!done(m)&&!live(m):true)).filter(m=>{if(!ui.query)return true;const map=rosterMap(d),hay=[m.id,m.division,m.stage,m.teamA,m.teamB,teamNames(map.get(m.teamA)),teamNames(map.get(m.teamB))].join(' ').toLowerCase();return hay.includes(ui.query.toLowerCase())}).sort((a,b)=>timeNum(a.time)-timeNum(b.time)||Number(a.court)-Number(b.court))}
function schedulePage(d){const list=filteredMatches(d),ds=divisions(d),cs=courts(d);const filters=`<div class="toolbar"><input id="scheduleSearch" type="search" placeholder="Search player, team or match" value="${esc(ui.query)}"><select data-filter="division"><option>All</option>${ds.map(x=>`<option ${ui.division===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select data-filter="court"><option>All</option>${cs.map(x=>`<option value="${x}" ${String(ui.court)===String(x)?'selected':''}>Court ${x}</option>`).join('')}</select><select data-filter="status"><option>All</option>${['Upcoming','Live','Final'].map(x=>`<option ${ui.status===x?'selected':''}>${x}</option>`).join('')}</select></div>`;let body='';if(ui.scheduleMode==='courts'){body=`<div class="court-groups">${cs.map(c=>{const g=list.filter(m=>Number(m.court)===c);return g.length?`<section class="court-group"><header><b>Court ${c}</b><span>${g.length} matches</span></header>${g.map(m=>matchCard(m,d)).join('')}</section>`:''}).join('')}</div>`}else{const ts=[...new Set(list.map(m=>m.time))].sort((a,b)=>timeNum(a)-timeNum(b));body=`<div class="timeline">${ts.map(t=>`<section class="time-group"><div class="time-label">${esc(niceTime(t))}</div><div class="time-matches">${list.filter(m=>m.time===t).map(m=>matchCard(m,d)).join('')}</div></section>`).join('')}</div>`}return `<header class="page-head"><div><div class="eyebrow">OFFICIAL MATCH SCHEDULE</div><h2>Schedule</h2><p>${esc(d.event.date)} · ${esc(d.event.venue)} · Courts ${cs[0]}–${cs.slice(-1)[0]}. Match times remain subject to Match Control.</p></div><div class="view-switch"><button class="${ui.scheduleMode==='timeline'?'active':''}" data-schedule-mode="timeline">Timeline</button><button class="${ui.scheduleMode==='courts'?'active':''}" data-schedule-mode="courts">Courts</button></div></header>${filters}${list.length?body:`<div class="empty"><b>No matches found</b>Change your filters or search.</div>`}`}
function scoreValue(v){return Number.isFinite(Number(v))?Number(v):0}function standingsFor(d,div,br){const teams=d.roster.filter(t=>t.division===div&&t.bracket===br),rr=d.matches.filter(m=>m.division===div&&m.bracket===br),policy=d.settings?.forfeitPQPolicy||'exclude';let rows=teams.map(t=>{const games=rr.filter(m=>done(m)&&[m.teamA,m.teamB].includes(t.code)&&winner(m));let w=games.filter(m=>winner(m)===t.code).length,pe=0,pc=0;for(const m of games){let a=m.teamA===t.code?m.scoreA:m.scoreB,b=m.teamA===t.code?m.scoreB:m.scoreA;if((a==null||b==null)&&m.status==='Forfeit'&&policy==='target_zero'){a=winner(m)===t.code?11:0;b=winner(m)===t.code?0:11}if(a!=null&&b!=null){pe+=scoreValue(a);pc+=scoreValue(b)}}return{...t,played:games.length,w,l:games.length-w,rate:games.length?w/games.length:0,pe,pc}});rows.sort((a,b)=>b.rate-a.rate||a.code.localeCompare(b.code));for(let i=0;i<rows.length;){let j=i+1;while(j<rows.length&&Math.abs(rows[i].rate-rows[j].rate)<1e-10)j++;let group=rows.slice(i,j);if(group.length===2){const [a,b]=group,h=rr.find(m=>done(m)&&[m.teamA,m.teamB].includes(a.code)&&[m.teamA,m.teamB].includes(b.code));if(h&&winner(h)){if(winner(h)===b.code)group=[b,a]}else group.sort((a,b)=>b.pe-a.pe||a.pc-b.pc||a.code.localeCompare(b.code))}else if(group.length>=3)group.sort((a,b)=>b.pe-a.pe||a.pc-b.pc||a.code.localeCompare(b.code));rows.splice(i,group.length,...group);i=j}return rows}
function standingsPage(d){const ds=divisions(d),visible=ui.standingsDivision==='All'?ds:ds.filter(x=>x===ui.standingsDivision),mine=new Set(profiles(d).map(p=>p.team.code));return `<header class="page-head"><div><div class="eyebrow">LIVE RANKINGS</div><h2>Standings</h2><p>Win Rate first · exactly two tied teams use head-to-head · three or more tied teams use PE, then PC. PQ is shown for reference.</p></div></header><div class="standings-filters"><select id="standingsDivision"><option>All</option>${ds.map(x=>`<option ${ui.standingsDivision===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>${visible.map(div=>`<section class="division-block"><div class="division-title"><h3>${esc(div)}</h3><span>${brackets(d,div).length} bracket${brackets(d,div).length===1?'':'s'}</span></div><div class="pool-grid">${brackets(d,div).map(br=>{const rows=standingsFor(d,div,br);return `<div class="pool-card"><div class="pool-head"><b>Bracket ${esc(br)}</b><span>W · L · PE · PC · PQ</span></div><div style="overflow:auto"><table class="standings-table"><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>PE</th><th>PC</th><th>PQ</th></tr></thead><tbody>${rows.map((t,i)=>`<tr class="${mine.has(t.code)?'mine':''}"><td class="rank" data-rank="${i+1}">${i+1}</td><td class="team-cell"><b>${esc(teamNames(t))}</b><span>${esc(t.code)}</span></td><td>${t.w}</td><td>${t.l}</td><td>${t.pe}</td><td>${t.pc}</td><td>${t.played?(!t.pc?t.pe:(t.pe/t.pc)).toFixed(4):'0.0000'}</td></tr>`).join('')}</tbody></table></div></div>`}).join('')}</div></section>`).join('')}<p class="standings-note">Official standings are driven by published Match Control results. Exact unresolved ties may require Tournament Director review.</p>`}
function playoffsPage(d){const ds=[...new Set((d.playoffs||[]).map(p=>p.division).filter(Boolean))],visible=ui.playoffDivision==='All'?ds:ds.filter(x=>x===ui.playoffDivision);const order=s=>/semifinal 1/i.test(s)?1:/semifinal 2/i.test(s)?2:/bronze/i.test(s)?3:/gold|championship/i.test(s)?4:9;return `<header class="page-head"><div><div class="eyebrow">TOURNAMENT PROGRESSION</div><h2>Playoffs</h2><p>Semifinals, bronze matches and championship matches update as Match Control confirms qualifiers and results.</p></div></header><div class="playoff-filter"><select id="playoffDivision"><option>All</option>${ds.map(x=>`<option ${ui.playoffDivision===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>${visible.map(div=>{const list=d.playoffs.filter(p=>p.division===div).sort((a,b)=>order(a.stage)-order(b.stage)||timeNum(a.time)-timeNum(b.time));return `<section class="playoff-division"><header><h3>${esc(div)}</h3><span class="muted" style="font-size:9px">${list.filter(done).length}/${list.length} resolved</span></header><div class="playoff-grid">${list.map(m=>{const map=rosterMap(d),a=map.get(m.teamA),b=map.get(m.teamB),gold=/gold|championship/i.test(m.stage||'');return `<button class="playoff-card ${gold?'gold':''}" data-match="${esc(m.id)}"><div class="playoff-stage">${esc(m.stage||'Playoff')}</div><h4>${esc(teamNames(a))}</h4><div class="versus">VS</div><h4>${esc(teamNames(b))}</h4><span class="status ${live(m)?'live':done(m)?'final':''}" style="margin:0;width:max-content">${esc(statusLabel(m))}</span><footer><span>Court ${esc(m.court||'TBD')}</span><span>${esc(niceTime(m.time))}</span></footer></button>`}).join('')}</div></section>`}).join('')}`}

/*
  v1.6 — Equalized Division Leaderboard
  Semifinal qualification ranking:
    1) Win/Loss Rate
    2) Highest Points Earned
    3) Lowest Points Conceded

  Uneven brackets are normalized to the smallest bracket size.
  Bottom-ranked team(s) from larger brackets are excluded from
  qualification calculations, and all matches involving those
  excluded teams are removed from adjusted W/L, PE and PC.
*/
ui.standingsMode = ui.standingsMode || 'leaderboard';

function standingsGenderClass(div){
  const s=String(div||'').toLowerCase();
  if(s.includes('mixed')) return 'standings-mixed';
  if(s.includes("women") || s.includes('women’s') || s.includes("women's")) return 'standings-women';
  if(s.includes("men") || s.includes('men’s') || s.includes("men's")) return 'standings-men';
  return 'standings-neutral';
}

function qualificationSlotsFor(d, div){
  const semis=(d.playoffs||[]).filter(m=>m.division===div && /semi/i.test(String(m.stage||'')));
  return semis.length ? semis.length*2 : 4;
}

function divisionPrelimComplete(d, div){
  const ms=(d.matches||[]).filter(m=>m.division===div && m.teamA && m.teamB && !m.removedFromSchedule);
  return !!ms.length && ms.every(done);
}

function equalizedDivisionLeaderboard(d, div){
  const brs=brackets(d,div);
  const roster=(d.roster||[]).filter(t=>t.division===div);
  const countByBracket=Object.fromEntries(brs.map(br=>[
    br,
    roster.filter(t=>t.bracket===br).length
  ]));
  const counts=Object.values(countByBracket).filter(Number.isFinite);
  const comparisonSize=counts.length?Math.min(...counts):0;
  const excludedByBracket={};
  const excludedCodes=new Set();

  for(const br of brs){
    const ranked=standingsFor(d,div,br);
    const extra=Math.max(0,(countByBracket[br]||0)-comparisonSize);
    const excluded=extra?ranked.slice(-extra):[];
    excludedByBracket[br]=excluded;
    excluded.forEach(t=>excludedCodes.add(t.code));
  }

  const policy=d.settings?.forfeitPQPolicy||'exclude';
  let rows=roster
    .filter(t=>!excludedCodes.has(t.code))
    .map(t=>{
      const excludedHere=new Set((excludedByBracket[t.bracket]||[]).map(x=>x.code));
      const games=(d.matches||[]).filter(m=>
        m.division===div &&
        m.bracket===t.bracket &&
        done(m) &&
        winner(m) &&
        [m.teamA,m.teamB].includes(t.code) &&
        !excludedHere.has(m.teamA) &&
        !excludedHere.has(m.teamB)
      );
      let w=0,pe=0,pc=0;
      for(const m of games){
        if(winner(m)===t.code)w++;
        let a=m.teamA===t.code?m.scoreA:m.scoreB;
        let b=m.teamA===t.code?m.scoreB:m.scoreA;
        if((a==null||b==null)&&m.status==='Forfeit'&&policy==='target_zero'){
          a=winner(m)===t.code?11:0;
          b=winner(m)===t.code?0:11;
        }
        if(a!=null&&b!=null){
          pe+=scoreValue(a);
          pc+=scoreValue(b);
        }
      }
      return{
        ...t,
        played:games.length,
        w,
        l:games.length-w,
        rate:games.length?w/games.length:0,
        pe,
        pc,
        adjusted:true
      };
    });

  rows.sort((a,b)=>
    b.rate-a.rate ||
    b.pe-a.pe ||
    a.pc-b.pc ||
    a.code.localeCompare(b.code)
  );

  // Competition ranking. Exact ties after all three published criteria
  // remain visibly tied instead of being silently resolved by team code.
  let lastKey=null,lastRank=0;
  rows=rows.map((r,i)=>{
    const key=`${r.rate.toFixed(12)}|${r.pe}|${r.pc}`;
    const rank=(key===lastKey)?lastRank:(i+1);
    if(key!==lastKey){lastKey=key;lastRank=rank}
    return {...r,rank};
  });

  const groups={};
  rows.forEach(r=>{
    const key=`${r.rate.toFixed(12)}|${r.pe}|${r.pc}`;
    (groups[key]||(groups[key]=[])).push(r);
  });
  rows=rows.map(r=>{
    const key=`${r.rate.toFixed(12)}|${r.pe}|${r.pc}`;
    return {...r,exactTie:(groups[key]||[]).length>1};
  });

  return{
    rows,
    brackets:brs,
    countByBracket,
    comparisonSize,
    excludedByBracket,
    unequal:new Set(counts).size>1,
    prelimComplete:divisionPrelimComplete(d,div),
    qualificationSlots:qualificationSlotsFor(d,div)
  };
}

function equalizationSummary(model){
  const counts=model.brackets.map(br=>model.countByBracket[br]||0);
  return counts.length?counts.join('–'):'—';
}

function excludedSummaryHtml(model){
  const chips=[];
  for(const br of model.brackets){
    for(const t of (model.excludedByBracket[br]||[])){
      chips.push(`<span class="pro-excluded-chip"><strong>Bracket ${esc(br)} #${model.countByBracket[br]}</strong> ${esc(t.code)} · ${esc(teamNames(t))}</span>`);
    }
  }
  return chips.length?`<div class="pro-excluded-list">${chips.join('')}</div>`:'';
}

function qualifierState(model,row,index){
  const slots=Math.min(model.qualificationSlots,model.rows.length);
  if(!slots)return'';
  const cutoff=model.rows[slots-1];
  if(!cutoff)return'';
  const sameCut=r=>Math.abs(r.rate-cutoff.rate)<1e-12 && r.pe===cutoff.pe && r.pc===cutoff.pc;
  const tiedAtCut=model.rows.some((r,i)=>i>=slots && sameCut(r)) && model.rows.some((r,i)=>i<slots && sameCut(r));
  if(tiedAtCut && sameCut(row))return'tie';
  return index<slots?'qualifying':'';
}

function divisionLeaderboardCard(d,div,mine){

  const slots=Math.min(model.qualificationSlots,model.rows.length);

    ? `Bracket sizes are ${distribution}. For semifinal qualification, every bracket is compared on a ${model.comparisonSize}-team basis. Results involving the bottom-ranked extra team(s) are removed from adjusted W/L, PE and PC.`

  return `<section class="pro-division-leaderboard ${standingsGenderClass(div)}">
    <header class="pro-leaderboard-head">
      <div class="pro-leaderboard-title">
        <h3>${esc(div)}</h3>

      </div>

        <span class="pro-eq-badge ${model.unequal?'uneven':''}">${model.unequal?`${distribution} → ${model.brackets.map(()=>model.comparisonSize).join('–')}`:`${distribution} balanced`}</span>
        <span class="pro-eq-badge">Top ${slots} semifinal positions</span>
        ${model.prelimComplete?'':`<span class="pro-eq-badge provisional">Provisional</span>`}
      </div>
    </header>
    <div class="pro-equalization-note">
      <div class="icon">↔</div>
      <div><b>${model.unequal?'Equalized cross-bracket comparison':'Balanced comparison'}</b><span>${esc(note)}${model.prelimComplete?'':' Current bracket positions may still change until all preliminary matches are completed.'}</span></div>
    </div>
    ${excludedSummaryHtml(model)}
    <div class="pro-leaderboard-scroll">
      <table class="pro-leaderboard-table">
        <thead><tr>
          <th>Rank</th>
          <th>Team</th>
          <th>Bracket</th>
          <th>MP</th>
          <th>W</th>
          <th>L</th>
          <th>Win Rate</th>
          <th>PE</th>
          <th>PC</th>
          <th class="pro-qualification">Semifinal picture</th>
        </tr></thead>
        <tbody>${model.rows.map((t,i)=>{
          const q=qualifierState(model,t,i);
          const cut=(i===slots && slots>0)?' cut-line':'';
          const mineClass=mine.has(t.code)?' mine':'';
          const qClass=q==='qualifying'?' qualifying':'';
          return `<tr class="${qClass}${cut}${mineClass}">
            <td class="rank">${t.rank}</td>
            <td class="team"><b>${esc(teamNames(t))}</b><span>${esc(t.code)}</span></td>
            <td class="bracket"><span class="pro-bracket-tag">${esc(t.bracket)}</span></td>
            <td>${t.played}</td>
            <td>${t.w}</td>
            <td>${t.l}</td>
            <td class="pro-win-rate">${(t.rate*100).toFixed(2)}%</td>
            <td>${t.pe}</td>
            <td>${t.pc}</td>
            <td class="pro-qualification">${q==='qualifying'?`<span class="pro-qualify-chip">● ${model.prelimComplete?'Semifinal position':'Currently top '+slots}</span>`:q==='tie'?`<span class="pro-qualify-chip tie">Tie at cut</span>`:''}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    <footer class="pro-rank-rule">
      <span>Qualification ranking:</span>
      <span class="pro-rank-step"><i>1</i> Win/Loss Rate</span><span class="pro-rank-arrow">→</span>
      <span class="pro-rank-step"><i>2</i> Highest PE</span><span class="pro-rank-arrow">→</span>
      <span class="pro-rank-step"><i>3</i> Lowest PC</span>
    </footer>
  </section>`;
}

  ${visible.map(div=>`<section class="pro-division-block ${standingsGenderClass(div)}">

function top4QuickCard(d,div,mine){
  const model=equalizedDivisionLeaderboard(d,div);

  const distribution=equalizationSummary(model);
  const className=standingsGenderClass(div);
  return `<article class="pro-top4-card ${className}">
    <header class="pro-top4-card-head">

        <b>${esc(div)}</b>
        <span>${model.brackets.length} bracket${model.brackets.length===1?'':'s'} · ${model.unequal?`${distribution} → ${model.brackets.map(()=>model.comparisonSize).join('–')}`:`${distribution} balanced`}</span>
      </div>
      <span class="pro-top4-status">${model.prelimComplete?'Official':'Live'}</span>
    </header>
    <div class="pro-top4-list">
      ${top.length?top.map((t,i)=>`<div class="pro-top4-row${mine.has(t.code)?' mine':''}">
        <span class="pro-top4-rank">${t.rank}</span>

    </footer>
  </article>`;
}


function top4LevelIndex(div){
  const s=String(div||'').toLowerCase();
  if(s.includes('beginner')) return 0;
  if(s.includes('low intermediate')) return 1;
  if(s.includes('high intermediate')) return 2;
  if(s.includes('advanced')) return 3;
  return 99;
}
function top4GenderIndex(div){
  const s=String(div||'').toLowerCase();
  if(s.includes('mixed')) return 2;
  if(s.includes("women") || s.includes("women’s") || s.includes("women's")) return 1;
  if(s.includes("men") || s.includes("men’s") || s.includes("men's")) return 0;
  return 99;
}
function top4MatrixSlots(visible){
  if((visible||[]).length<=1) return (visible||[]).map(div=>({div}));
  const byKey=new Map();
  (visible||[]).forEach(div=>{
    const g=top4GenderIndex(div), l=top4LevelIndex(div);
    if(g<3 && l<4) byKey.set(`${g}-${l}`,div);
  });
  const slots=[];
  for(let gender=0;gender<3;gender++){
    for(let level=0;level<4;level++){
      const div=byKey.get(`${gender}-${level}`) || null;
      slots.push({div,gender,level});
    }
  }
  return slots;
}

function top4QuickView(d,visible,mine){
  const slots=top4MatrixSlots(visible);
  return `<section class="pro-top4-section">
    <div class="pro-top4-heading">
      <div>
        <span class="eyebrow">QUICK VIEW</span>
        <h2>Current Top 4</h2>
        <p>One semifinal picture per division/category, using the equalized leaderboard rules.</p>
      </div>
      <div class="pro-top4-legend"><i></i><span>Updates as official match results are published</span></div>
    </div>
    <div class="pro-top4-grid">${slots.map(slot=>slot.div
      ? top4QuickCard(d,slot.div,mine)
      : `<div class="pro-top4-placeholder" aria-hidden="true"></div>`
    ).join('')}</div>
  </section>`;
}

};

// Update Rules & Format so it explains the Animo qualification rule correctly.
const _animoRulesPageBase=rulesPage;
rulesPage=function(d){
  const mr=d.settings?.matchRules||{};
  const keys=['Preliminary','Semifinal','Bronze','Championship'];
  return `<header class="pro-page-head"><div><span class="kicker">FORMAT & RULES</span><h1>Match Rules</h1><p>Published scoring and qualification rules are controlled by Match Control.</p></div></header>
    <div class="rules-grid">${keys.map(k=>{
      const r=mr[k]||{},sample=allMatches(d).find(m=>stageKey(m.stage)===k),
        target=Number(r.target_score??sample?.ruleTarget??11),
        deuce=Boolean(r.deuce_enabled??(Number(sample?.ruleWinBy||1)>1));
      return `<div class="rule-card"><small>${esc(k)}</small><b>Race to ${target}</b><span>${deuce?'Win by 2 / Deuce enabled':'No deuce · first to '+target}</span></div>`;
    }).join('')}</div>
    <div class="section-head"><div><h3>Semifinal qualification leaderboard</h3></div></div>
    <div class="info-grid">
      <div class="info-card"><small>1st criterion</small><b>Win/Loss Rate</b></div>
      <div class="info-card"><small>2nd criterion</small><b>Highest Points Earned</b></div>
      <div class="info-card"><small>3rd criterion</small><b>Lowest Points Conceded</b></div>
    </div>
    <div class="pro-equalization-note" style="margin:14px 0 0">
      <div class="icon">↔</div>
      <div><b>Uneven bracket equalization</b><span>When brackets have different team counts, qualification comparison is normalized to the smallest bracket size. Bottom-ranked extra team(s) from larger brackets are excluded from the division leaderboard, and results involving those teams are removed from adjusted W/L, PE and PC. Official bracket results remain unchanged.</span></div>
    </div>`;
};

    ui.standingsMode='leaderboard';

  }

  if(!b)return;
  ui.standingsMode=b.dataset.standingsMode;
  render();
});
