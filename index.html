/*
  v1.6 — Equalized Division Leaderboard
  Semifinal qualification ranking:
    1) Win/Loss Rate
    2) Highest Points Earned
    3) Lowest Points Conceded


  Uneven brackets are normalized to the smallest bracket size.
  Bottom-ranked team(s) from larger brackets are excluded from
  qualification calculations, and all matches involving those
  excluded teams are removed from adjusted W/L, PE and PC.
*/
ui.standingsMode = ui.standingsMode || 'leaderboard';


function standingsGenderClass(div){
  const s=String(div||'').toLowerCase();
  if(s.includes('mixed')) return 'standings-mixed';
  if(s.includes("women") || s.includes('women’s') || s.includes("women's")) return 'standings-women';
  if(s.includes("men") || s.includes('men’s') || s.includes("men's")) return 'standings-men';
  return 'standings-neutral';
}


function qualificationSlotsFor(d, div){
  const semis=(d.playoffs||[]).filter(m=>m.division===div && /semi/i.test(String(m.stage||'')));
  return semis.length ? semis.length*2 : 4;
}


function divisionPrelimComplete(d, div){
  const ms=(d.matches||[]).filter(m=>m.division===div && m.teamA && m.teamB && !m.removedFromSchedule);
  return !!ms.length && ms.every(done);
}


function equalizedDivisionLeaderboard(d, div){
  const brs=brackets(d,div);
  const roster=(d.roster||[]).filter(t=>t.division===div);
  const countByBracket=Object.fromEntries(brs.map(br=>[
    br,
    roster.filter(t=>t.bracket===br).length
  ]));
  const counts=Object.values(countByBracket).filter(Number.isFinite);
  const comparisonSize=counts.length?Math.min(...counts):0;
  const excludedByBracket={};
  const excludedCodes=new Set();


  for(const br of brs){
    const ranked=standingsFor(d,div,br);
    const extra=Math.max(0,(countByBracket[br]||0)-comparisonSize);
    const excluded=extra?ranked.slice(-extra):[];
    excludedByBracket[br]=excluded;
    excluded.forEach(t=>excludedCodes.add(t.code));
  }


  const policy=d.settings?.forfeitPQPolicy||'exclude';
  let rows=roster
    .filter(t=>!excludedCodes.has(t.code))
    .map(t=>{
      const excludedHere=new Set((excludedByBracket[t.bracket]||[]).map(x=>x.code));
      const games=(d.matches||[]).filter(m=>
        m.division===div &&
        m.bracket===t.bracket &&
        done(m) &&
        winner(m) &&
        [m.teamA,m.teamB].includes(t.code) &&
        !excludedHere.has(m.teamA) &&
        !excludedHere.has(m.teamB)
      );
      let w=0,pe=0,pc=0;
      for(const m of games){
        if(winner(m)===t.code)w++;
        let a=m.teamA===t.code?m.scoreA:m.scoreB;
        let b=m.teamA===t.code?m.scoreB:m.scoreA;
        if((a==null||b==null)&&m.status==='Forfeit'&&policy==='target_zero'){
          a=winner(m)===t.code?11:0;
          b=winner(m)===t.code?0:11;
        }
        if(a!=null&&b!=null){
          pe+=scoreValue(a);
          pc+=scoreValue(b);
        }
      }
      return{
        ...t,
        played:games.length,
        w,
        l:games.length-w,
        rate:games.length?w/games.length:0,
        pe,
        pc,
        adjusted:true
      };
    });


  rows.sort((a,b)=>
    b.rate-a.rate ||
    b.pe-a.pe ||
    a.pc-b.pc ||
    a.code.localeCompare(b.code)
  );


  // Competition ranking. Exact ties after all three published criteria
  // remain visibly tied instead of being silently resolved by team code.
  let lastKey=null,lastRank=0;
  rows=rows.map((r,i)=>{
    const key=`${r.rate.toFixed(12)}|${r.pe}|${r.pc}`;
    const rank=(key===lastKey)?lastRank:(i+1);
    if(key!==lastKey){lastKey=key;lastRank=rank}
    return {...r,rank};
  });


  const groups={};
  rows.forEach(r=>{
    const key=`${r.rate.toFixed(12)}|${r.pe}|${r.pc}`;
    (groups[key]||(groups[key]=[])).push(r);
  });
  rows=rows.map(r=>{
    const key=`${r.rate.toFixed(12)}|${r.pe}|${r.pc}`;
    return {...r,exactTie:(groups[key]||[]).length>1};
  });


  return{
    rows,
    brackets:brs,
    countByBracket,
    comparisonSize,
    excludedByBracket,
    unequal:new Set(counts).size>1,
    prelimComplete:divisionPrelimComplete(d,div),
    qualificationSlots:qualificationSlotsFor(d,div)
  };
}


function equalizationSummary(model){
  const counts=model.brackets.map(br=>model.countByBracket[br]||0);
  return counts.length?counts.join('–'):'—';
}


function excludedSummaryHtml(model){
  const chips=[];
  for(const br of model.brackets){
    for(const t of (model.excludedByBracket[br]||[])){
      chips.push(`<span class="pro-excluded-chip"><strong>Bracket ${esc(br)} #${model.countByBracket[br]}</strong> ${esc(t.code)} · ${esc(teamNames(t))}</span>`);
    }
  }
  return chips.length?`<div class="pro-excluded-list">${chips.join('')}</div>`:'';
}


function qualifierState(model,row,index){
  const slots=Math.min(model.qualificationSlots,model.rows.length);
  if(!slots)return'';
  const cutoff=model.rows[slots-1];
  if(!cutoff)return'';
  const sameCut=r=>Math.abs(r.rate-cutoff.rate)<1e-12 && r.pe===cutoff.pe && r.pc===cutoff.pc;
  const tiedAtCut=model.rows.some((r,i)=>i>=slots && sameCut(r)) && model.rows.some((r,i)=>i<slots && sameCut(r));
  if(tiedAtCut && sameCut(row))return'tie';
  return index<slots?'qualifying':'';
}


function divisionLeaderboardCard(d,div,mine){
  const model=equalizedDivisionLeaderboard(d,div);
  const distribution=equalizationSummary(model);
  const slots=Math.min(model.qualificationSlots,model.rows.length);
  const note=model.unequal
    ? `Bracket sizes are ${distribution}. For semifinal qualification, every bracket is compared on a ${model.comparisonSize}-team basis. Results involving the bottom-ranked extra team(s) are removed from adjusted W/L, PE and PC.`
    : `All brackets already have ${model.comparisonSize} team${model.comparisonSize===1?'':'s'}, so no equalization adjustment is required.`;
  return `<section class="pro-division-leaderboard ${standingsGenderClass(div)}">
    <header class="pro-leaderboard-head">
      <div class="pro-leaderboard-title">
        <h3>${esc(div)}</h3>
        <p>Single division/category leaderboard used to determine semifinal qualification.</p>
      </div>
      <div class="pro-leaderboard-badges">
        <span class="pro-eq-badge ${model.unequal?'uneven':''}">${model.unequal?`${distribution} → ${model.brackets.map(()=>model.comparisonSize).join('–')}`:`${distribution} balanced`}</span>
        <span class="pro-eq-badge">Top ${slots} semifinal positions</span>
        ${model.prelimComplete?'':`<span class="pro-eq-badge provisional">Provisional</span>`}
      </div>
    </header>
    <div class="pro-equalization-note">
      <div class="icon">↔</div>
      <div><b>${model.unequal?'Equalized cross-bracket comparison':'Balanced comparison'}</b><span>${esc(note)}${model.prelimComplete?'':' Current bracket positions may still change until all preliminary matches are completed.'}</span></div>
    </div>
    ${excludedSummaryHtml(model)}
    <div class="pro-leaderboard-scroll">
      <table class="pro-leaderboard-table">
        <thead><tr>
          <th>Rank</th>
          <th>Team</th>
          <th>Bracket</th>
          <th>MP</th>
          <th>W</th>
          <th>L</th>
          <th>Win Rate</th>
          <th>PE</th>
          <th>PC</th>
          <th class="pro-qualification">Semifinal picture</th>
        </tr></thead>
        <tbody>${model.rows.map((t,i)=>{
          const q=qualifierState(model,t,i);
          const cut=(i===slots && slots>0)?' cut-line':'';
          const mineClass=mine.has(t.code)?' mine':'';
          const qClass=q==='qualifying'?' qualifying':'';
          return `<tr class="${qClass}${cut}${mineClass}">
            <td class="rank">${t.rank}</td>
            <td class="team"><b>${esc(teamNames(t))}</b><span>${esc(t.code)}</span></td>
            <td class="bracket"><span class="pro-bracket-tag">${esc(t.bracket)}</span></td>
            <td>${t.played}</td>
            <td>${t.w}</td>
            <td>${t.l}</td>
            <td class="pro-win-rate">${(t.rate*100).toFixed(2)}%</td>
            <td>${t.pe}</td>
            <td>${t.pc}</td>
            <td class="pro-qualification">${q==='qualifying'?`<span class="pro-qualify-chip">● ${model.prelimComplete?'Semifinal position':'Currently top '+slots}</span>`:q==='tie'?`<span class="pro-qualify-chip tie">Tie at cut</span>`:''}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    <footer class="pro-rank-rule">
      <span>Qualification ranking:</span>
      <span class="pro-rank-step"><i>1</i> Win/Loss Rate</span><span class="pro-rank-arrow">→</span>
      <span class="pro-rank-step"><i>2</i> Highest PE</span><span class="pro-rank-arrow">→</span>
      <span class="pro-rank-step"><i>3</i> Lowest PC</span>
    </footer>
  </section>`;
}

  return `<div class="pro-bracket-standings-note">Bracket standings preserve every official preliminary result. They are shown separately from the equalized division leaderboard used for semifinal qualification.</div>
  ${visible.map(div=>`<section class="pro-division-block ${standingsGenderClass(div)}">

function top4QuickCard(d,div,mine){
  const model=equalizedDivisionLeaderboard(d,div);
  const top=model.rows.slice(0,4);
  const distribution=equalizationSummary(model);
  const className=standingsGenderClass(div);
  return `<article class="pro-top4-card ${className}">
    <header class="pro-top4-card-head">
      <div class="pro-top4-card-title">
        <b>${esc(div)}</b>
        <span>${model.brackets.length} bracket${model.brackets.length===1?'':'s'} · ${model.unequal?`${distribution} → ${model.brackets.map(()=>model.comparisonSize).join('–')}`:`${distribution} balanced`}</span>
      </div>
      <span class="pro-top4-status">${model.prelimComplete?'Official':'Live'}</span>
    </header>
    <div class="pro-top4-list">

<script id="animo-player-v122-admin-authoritative-standings">
/*
 v1.22 — Admin-authoritative standings mirror
 Admin Match Control is now the only standings authority.
 Player Portal consumes the published Admin bracket and qualification rows directly.
 The local v1.21 calculation remains only as a transition fallback if an older feed is encountered.
*/
window.ANIMO_PLAYER_RELEASE='v1.22-admin-standings-mirror';


function ppxPlayerOfficialPrelimDone(m){
  return ['Completed','Forfeit'].includes(String(m?.status||'')) && Boolean(winner(m));
}
function ppxPlayerDQ(d,code){
  return Boolean(code && d?.registration?.teamDisqualified?.[code]);
}
function ppxPlayerNum(v){
  const n=Number(v); return Number.isFinite(n)?n:null;
}


// Exact bracket-stat parity with Admin: only Completed/Forfeit preliminary results count.
standingsFor=function(d,div,br){
  const teams=(d.roster||[]).filter(t=>t.division===div&&t.bracket===br);
  const rr=(d.matches||[]).filter(m=>m.division===div&&m.bracket===br);
  const policy=d.settings?.forfeitPQPolicy||'exclude';
  let rows=teams.map(t=>{
    const games=rr.filter(m=>ppxPlayerOfficialPrelimDone(m)&&[m.teamA,m.teamB].includes(t.code));
    let w=0,pe=0,pc=0;
    for(const m of games){
      const mw=winner(m); if(mw===t.code)w++;
      let a=ppxPlayerNum(m.teamA===t.code?m.scoreA:m.scoreB);
      let b=ppxPlayerNum(m.teamA===t.code?m.scoreB:m.scoreA);
      if((a==null||b==null)&&m.status==='Forfeit'&&policy==='target_zero'){
        const target=Number(m.targetScore)||11;
        a=mw===t.code?target:0; b=mw===t.code?0:target;
      }
      if(a!=null&&b!=null){pe+=a;pc+=b}
    }
    return {...t,played:games.length,w,l:games.length-w,rate:games.length?w/games.length:0,pe,pc};
  });
  rows.sort((a,b)=>b.rate-a.rate||a.code.localeCompare(b.code));
  const same=(a,b)=>Math.abs(Number(a)-Number(b))<1e-12;
  for(let i=0;i<rows.length;){
    let j=i+1; while(j<rows.length&&same(rows[i].rate,rows[j].rate))j++;
    let group=rows.slice(i,j);
    if(group.length===2){
      const [a,b]=group;
      const h=rr.find(m=>ppxPlayerOfficialPrelimDone(m)&&((m.teamA===a.code&&m.teamB===b.code)||(m.teamA===b.code&&m.teamB===a.code)));
      if(h&&winner(h)){if(winner(h)===b.code)group=[b,a]}
      else group.sort((x,y)=>y.pe-x.pe||x.pc-y.pc||x.code.localeCompare(y.code));
    }else if(group.length>=3){
      group.sort((x,y)=>y.pe-x.pe||x.pc-y.pc||x.code.localeCompare(y.code));
    }
    rows.splice(i,group.length,...group); i=j;
  }
  rows.forEach(r=>{r.pq=r.played?(r.pc?r.pe/r.pc:r.pe):0});
  return rows;
};


// Prefer Admin-published round-robin completeness flags when available.
divisionPrelimComplete=function(d,div){
  const integrity=d?.integrity?.bracketComplete?.[div];
  if(integrity&&typeof integrity==='object'){
    const vals=Object.values(integrity);
    if(vals.length)return vals.every(x=>x?.complete===true);
  }
  const ms=(d.matches||[]).filter(m=>m.division===div&&m.teamA&&m.teamB&&!m.removedFromSchedule);
  return !!ms.length&&ms.every(m=>['Completed','Forfeit'].includes(String(m.status||''))&&Boolean(winner(m)));
};


// Mirrors Admin ppxDivisionQualificationLeaderboard().
equalizedDivisionLeaderboard=function(d,div){
  const brs=brackets(d,div);
  const fullRoster=(d.roster||[]).filter(t=>t.division===div);
  const eligibleRoster=fullRoster.filter(t=>!ppxPlayerDQ(d,t.code));
  const bracketRows={};
  for(const br of brs) bracketRows[br]=standingsFor(d,div,br).filter(r=>!ppxPlayerDQ(d,r.code));
  const countByBracket=Object.fromEntries(brs.map(br=>[br,(bracketRows[br]||[]).length]));
  const counts=brs.map(br=>countByBracket[br]).filter(n=>Number.isInteger(n)&&n>0);
  const comparisonSize=counts.length?Math.min(...counts):0;
  const excludedByBracket={},excludedCodes=new Set();
  for(const br of brs){
    const ranked=bracketRows[br]||[];
    const extra=Math.max(0,ranked.length-comparisonSize);
    const excluded=extra?ranked.slice(-extra):[];
    excludedByBracket[br]=excluded;
    excluded.forEach(t=>excludedCodes.add(t.code));
  }
  const dqCodes=new Set(fullRoster.filter(t=>ppxPlayerDQ(d,t.code)).map(t=>t.code));
  const ignored=new Set([...excludedCodes,...dqCodes]);
  const policy=d.settings?.forfeitPQPolicy||'exclude';
  let rows=eligibleRoster.filter(t=>!excludedCodes.has(t.code)).map(t=>{
    const games=(d.matches||[]).filter(m=>
      m.division===div&&m.bracket===t.bracket&&ppxPlayerOfficialPrelimDone(m)&&
      [m.teamA,m.teamB].includes(t.code)&&!ignored.has(m.teamA)&&!ignored.has(m.teamB)
    );
    let w=0,pe=0,pc=0;
    for(const m of games){
      const mw=winner(m); if(mw===t.code)w++;
      let a=ppxPlayerNum(m.teamA===t.code?m.scoreA:m.scoreB);
      let b=ppxPlayerNum(m.teamA===t.code?m.scoreB:m.scoreA);
      if((a==null||b==null)&&m.status==='Forfeit'&&policy==='target_zero'){
        const target=Number(m.targetScore)||11;
        a=mw===t.code?target:0; b=mw===t.code?0:target;
      }
      if(a!=null&&b!=null){pe+=a;pc+=b}
    }
    const raw=(bracketRows[t.bracket]||[]).find(r=>r.code===t.code);
    const played=games.length, rate=played?w/played:0;
    return {...t,played,w,l:played-w,rate,pe,pc,pq:played?(pc?pe/pc:pe):0,adjusted:true,
      rawPlayed:raw?.played??played,rawW:raw?.w??w,rawL:raw?.l??played-w,rawRate:raw?.rate??rate};
  });
  rows.sort((a,b)=>b.rate-a.rate||b.pe-a.pe||a.pc-b.pc||a.code.localeCompare(b.code));
  let lastKey=null,lastRank=0;
  rows=rows.map((r,i)=>{
    const key=`${Number(r.rate).toFixed(12)}|${r.pe}|${r.pc}`;
    const rank=key===lastKey?lastRank:i+1;
    if(key!==lastKey){lastKey=key;lastRank=rank}
    return {...r,rank};
  });
  const groups={}; rows.forEach(r=>{const k=`${Number(r.rate).toFixed(12)}|${r.pe}|${r.pc}`;(groups[k]||(groups[k]=[])).push(r)});
  rows=rows.map(r=>{const k=`${Number(r.rate).toFixed(12)}|${r.pe}|${r.pc}`;return {...r,exactTie:(groups[k]||[]).length>1}});
  return {rows,brackets:brs,countByBracket,comparisonSize,excludedByBracket,
    unequal:new Set(counts).size>1,prelimComplete:divisionPrelimComplete(d,div),qualificationSlots:qualificationSlotsFor(d,div)};
};


function ppxWrCell(t,unequal){
  const q=(Number(t.rate||0)*100).toFixed(2)+'%';
  const raw=(Number(t.rawRate??t.rate??0)*100).toFixed(2)+'%';
  const differs=Math.abs(Number(t.rawRate??t.rate)-Number(t.rate))>1e-12 || Number(t.rawPlayed??t.played)!==Number(t.played);
  return `<span class="wr-main">${q}</span>${unequal&&differs?`<span class="wr-raw">Raw ${raw}</span>`:''}`;
}


// Re-render the qualification leaderboard with a transparent formula and raw-vs-adjusted rate when needed.
divisionLeaderboardCard=function(d,div,mine){

    <div class="pro-equalization-note"><div class="icon">↔</div><div><b>${model.unequal?'Equalized cross-bracket comparison':'Balanced comparison'}</b><span>${esc(note)}${model.prelimComplete?'':' Current positions remain provisional until all preliminary matches are complete.'}</span><div class="pro-wr-formula">Qualification Win Rate = Wins ÷ Matches Played × 100.</div></div></div>
    ${excludedSummaryHtml(model)}
    <div class="pro-leaderboard-scroll"><table class="pro-leaderboard-table"><thead><tr><th>Rank</th><th>Team</th><th>Bracket</th><th>MP</th><th>W</th><th>L</th><th>Win Rate</th><th>PE</th><th>PC</th><th class="pro-qualification">Semifinal picture</th></tr></thead>
    <tbody>${model.rows.map((t,i)=>{const q=qualifierState(model,t,i),cut=(i===slots&&slots>0)?' cut-line':'',mineClass=mine.has(t.code)?' mine':'',qClass=q==='qualifying'?' qualifying':'';return `<tr class="${qClass}${cut}${mineClass}"><td class="rank">${t.rank}</td><td class="team"><b>${esc(teamNames(t))}</b><span>${esc(t.code)}</span></td><td class="bracket"><span class="pro-bracket-tag">${esc(t.bracket)}</span></td><td>${t.played}</td><td>${t.w}</td><td>${t.l}</td><td class="pro-win-rate">${ppxWrCell(t,model.unequal)}</td><td>${t.pe}</td><td>${t.pc}</td><td class="pro-qualification">${q==='qualifying'?`<span class="pro-qualify-chip">● ${model.prelimComplete?'Semifinal position':'Currently top '+slots}</span>`:q==='tie'?`<span class="pro-qualify-chip tie">Tie at cut</span>`:''}</td></tr>`}).join('')}</tbody></table></div>
    <footer class="pro-rank-rule"><span>Qualification ranking:</span><span class="pro-rank-step"><i>1</i> Win Rate</span><span class="pro-rank-arrow">→</span><span class="pro-rank-step"><i>2</i> Highest PE</span><span class="pro-rank-arrow">→</span><span class="pro-rank-step"><i>3</i> Lowest PC</span></footer>
  </section>`;
};


// Quick cards now use the same two-decimal authoritative qualification rate.
top4QuickCard=function(d,div,mine){

  <footer class="pro-top4-footer"><span>${model.prelimComplete?'Top 4 semifinal picture':'Provisional top 4'}</span><button class="pro-top4-open" data-open-division="${esc(div)}">Open leaderboard →</button></footer></article>`;

/* v1.22 authoritative bridge — Admin-published standings are the sole authority. */
const __v122LocalStandingsFor=standingsFor;
const __v122LocalDivisionPrelimComplete=divisionPrelimComplete;
const __v122LocalEqualizedDivisionLeaderboard=equalizedDivisionLeaderboard;
const __v122LocalQualifierState=qualifierState;


function ppxAuthoritativeStandings(d){

  return s&&s.source==='admin-authoritative'&&Number(s.version)>=2&&s.divisions?s:null;
}
function ppxAuthoritativeDivision(d,div){return ppxAuthoritativeStandings(d)?.divisions?.[div]||null}
function ppxMirrorRosterRow(d,code,extra={}){
  const base=rosterMap(d).get(code)||{code,players:[]};
  return {...base,...extra,code};
}


standingsFor=function(d,div,br){
  const rec=ppxAuthoritativeDivision(d,div)?.brackets?.[br];
  if(Array.isArray(rec?.rows)){
    window.__ANIMO_STANDINGS_SOURCE__='admin-authoritative';
    return rec.rows.map(r=>ppxMirrorRosterRow(d,r.code,{

      rate:Number(r.winRate)||0,pe:Number(r.pe)||0,pc:Number(r.pc)||0,pq:Number(r.pq)||0,
      rank:Number(r.rank)||0,__authoritative:true
    }));
  }

divisionPrelimComplete=function(d,div){

  return __v122LocalDivisionPrelimComplete(d,div);
};


equalizedDivisionLeaderboard=function(d,div){

  if(Array.isArray(q?.rows)){
    window.__ANIMO_STANDINGS_SOURCE__='admin-authoritative';

    const excludedByBracket=Object.fromEntries(brs.map(br=>[
      br,(q.excludedByBracket?.[br]||[]).map(code=>ppxMirrorRosterRow(d,code,{bracket:br}))
    ]));
    const rows=q.rows.map(r=>ppxMirrorRosterRow(d,r.code,{
      bracket:r.bracket||'',played:Number(r.mp)||0,w:Number(r.w)||0,l:Number(r.l)||0,
      rate:Number(r.winRate)||0,pe:Number(r.pe)||0,pc:Number(r.pc)||0,pq:Number(r.pq)||0,
      rawPlayed:Number(r.rawMp??r.mp)||0,rawW:Number(r.rawW??r.w)||0,rawL:Number(r.rawL??r.l)||0,
      rawRate:Number(r.rawWinRate??r.winRate)||0,rawPe:Number(r.rawPe??r.pe)||0,rawPc:Number(r.rawPc??r.pc)||0,
      rawPq:Number(r.rawPq??r.pq)||0,adjusted:Boolean(r.adjusted),rank:Number(r.rank)||0,
      qualificationState:r.qualificationState||'',exactTie:r.qualificationState==='tie',__authoritative:true
    }));
    const counts=brs.map(br=>Number(countByBracket[br])||0).filter(n=>n>0);
    return{
      rows,brackets:brs,countByBracket,comparisonSize:Number(q.commonTeamCount)||0,excludedByBracket,
      unequal:typeof q.unequal==='boolean'?q.unequal:new Set(counts).size>1,

      qualificationSlots:Number(q.qualificationSlots)||4,authoritative:true,sourceRevision:Number(s.sourceRevision)||0
    };
  }

  return __v122LocalEqualizedDivisionLeaderboard(d,div);
};


qualifierState=function(model,row,index){

window.__ANIMO_STANDINGS_HEALTH__=function(){

  const sh=s?.divisions?.['Beginner Mixed Doubles']?.brackets?.C?.rows?.find(r=>r.code==='BX-C2')||null;

    release:window.ANIMO_PLAYER_RELEASE,
    source:s?.source||'fallback-local',
    standingsVersion:Number(s?.version)||0,revision:Number(s?.sourceRevision)||0,pqFormula:s?.pqFormula||null,
    sharon:sh?{code:sh.code,mp:sh.mp,w:sh.w,l:sh.l,winRate:sh.winRate,pe:sh.pe,pc:sh.pc,pq:sh.pq}:null
  };
};
